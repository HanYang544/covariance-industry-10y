# Frozen first-round protocol: make changes only for a separately named experiment.
project:
  name: preliminary_industry_10
  output_dir: outputs/preliminary
data:
  raw_dir: data/raw
  processed_dir: data/processed
  history_start: "2003-01-01"
  splits:
    train: ["2005-01-01", "2017-12-31"]
    validation: ["2018-01-01", "2020-12-31"]
    test: ["2021-01-01", "2025-12-31"]
forecast:
  horizon: 20
  lookback_windows: [20, 60, 120, 252]
  train_stride: 5
  validation_stride: 20
  test_stride: 20
covariance:
  numerical_epsilon: 1.0e-8
features:
  reliability_window: 60
model:
  architectures: [linear, mlp]
  hidden_dim: 16
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 32
  max_epochs: 100
  early_stopping_patience: 15
evaluation:
  random_seeds: [1, 2, 3, 4, 5]
  ewma_decays: [0.94, 0.97]
  reliability_temperatures: [0.01, 0.03, 0.1, 0.3, 1.0]
  bootstrap_repetitions: 5000
  bootstrap_block_lengths: [1, 3, 6]
  bootstrap_seed: 20261012
backtest:
  transaction_cost_bps: [0, 5, 10]
  execution_lag_days: [0, 1]
